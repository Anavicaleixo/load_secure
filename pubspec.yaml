name: load_secure
description: Aplicação de gestão industrial com autenticação e monitoramento.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^3.0.0

  # Charts
  fl_chart: ^0.66.2

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.1.0

  # Storage
  shared_preferences: ^2.2.2

  # Supabase
  supabase_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
